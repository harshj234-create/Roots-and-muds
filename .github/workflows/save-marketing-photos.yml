# Downloads free-licence Unsplash photos (listed in marketing/unsplash-images.txt) for social posts.
# Lives on the marketing-photos branch only; it never touches the website.
name: Save marketing photos
on:
  workflow_dispatch:
  push:
    branches: [marketing-photos]
    paths: ["marketing/unsplash-images.txt", ".github/workflows/save-marketing-photos.yml"]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download photos
        run: |
          mkdir -p marketing/photos
          log=marketing/download-log.txt; : > $log
          while read -r id photo; do
            [ -z "$id" ] && continue
            out="marketing/photos/$id.jpg"
            code=$(curl -sSL -o "$out" -w "%{http_code}" "https://images.unsplash.com/$photo?fm=jpg&q=85&w=1600&fit=max")
            echo "$id $code $(file -b "$out" | cut -c1-30)" >> $log
            file "$out" | grep -q JPEG || rm -f "$out"
          done < marketing/unsplash-images.txt
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing
          git diff --cached --quiet || git commit -m "Save marketing photos from Unsplash"
          git push
