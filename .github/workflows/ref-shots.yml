name: Reference screenshots
on:
  workflow_dispatch:
  push:
    branches: [marketing-photos]
    paths: ["marketing/ref/shoot.mjs", ".github/workflows/ref-shots.yml"]
permissions:
  contents: write
jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i playwright@1 && npx playwright install --with-deps chromium
      - run: node marketing/ref/shoot.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketing/ref/shots
          git diff --cached --quiet || git commit -m "Reference screenshots"
          git push
