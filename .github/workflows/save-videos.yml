# Downloads, trims and compresses the skincare clips listed in data/media.json into public/videos/.
name: Save videos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/media.json", "scripts/save-videos.mjs"]
permissions:
  contents: write
jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: node scripts/save-videos.mjs
      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos
          git diff --cached --quiet || git commit -m "Save skincare videos"
          git pull --rebase
          git push
